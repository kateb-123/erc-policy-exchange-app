<script>
// The phone Menu button: same panel as the Exchange's bar.
(() => {
  const nav = document.querySelector('.topnav');
  const btn = document.getElementById('menu-btn');
  btn.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', String(open));
  });
})();
</script>
<script type="module">
// The same listserv script the share page's opt-in posts to (erc-tools'
// listserv-signup page before this one): name, email, and the moment.
const LISTSERV = 'https://script.google.com/macros/s/AKfycbz8neQVg5opjiTIATq8-xBhTFiA1WaDx8ST6rKAduxz0cf3LYAChNstg_UK1hoizoZ_/exec';

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const dots = () => {
  const d = el('span', 'dots');
  d.append(el('i'), el('i'), el('i'));
  return d;
};

const root = document.getElementById('root');
root.innerHTML = `
  <form id="f" class="form form--narrow" novalidate>
    <div class="field">
      <label for="n">Your name</label>
      <input id="n" type="text" autocomplete="name">
    </div>
    <div class="field">
      <label for="e">Your email address</label>
      <input id="e" type="email" autocomplete="email">
    </div>
    <div class="btns field--full">
      <button type="submit" class="btn" id="go">Subscribe »</button>
    </div>
    <p class="status field--full" id="stat" aria-live="polite"></p>
  </form>
`;

const form = document.getElementById('f');
const stat = document.getElementById('stat');
const setStat = (msg, kind) => {
  stat.className = `status field--full${kind ? ' status--' + kind : ''}`;
  stat.replaceChildren();
  if (kind === 'busy' && msg) { stat.append(dots(), document.createTextNode(msg)); }
  else stat.textContent = msg;
};

const doneBox = el('div', 'done');
doneBox.hidden = true;
root.append(doneBox);

form.addEventListener('submit', async event => {
  event.preventDefault();
  const name = document.getElementById('n').value.trim();
  const email = document.getElementById('e').value.trim();
  const errors = [];
  if (!name) errors.push('Add your name.');
  if (!email) errors.push('Add your email address.');
  else if (!/^\S+@\S+\.\S+$/.test(email)) errors.push("That email address doesn't look right.");
  if (errors.length) return setStat(errors.join(' '), 'error');

  const go = document.getElementById('go');
  go.disabled = true;
  setStat('Sending', 'busy');
  try {
    const now = new Date();
    const date_subscribed = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    await fetch(LISTSERV, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({ action: 'listserv_signup', name, email, date_subscribed, time: now.toTimeString().slice(0, 8) }),
    });
    form.reset();
    setStat('');
    const title = el('h3', '', 'Thank you. You are on the list.');
    title.tabIndex = -1;
    doneBox.replaceChildren(title);
    doneBox.append(el('p', '', 'The next ERC newsletter will come to ' + email + '.'));
    const back = el('a', 'btn-outline', 'Back to the Exchange');
    back.href = '../';
    doneBox.append(back);
    form.hidden = true; doneBox.hidden = false;
    title.focus();
  } catch {
    setStat("Couldn't reach the server. Check your connection and try again.", 'error');
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
