<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERC Policy Exchange</title>
  <meta
    name="description"
    content="Education Research Center — Policy Exchange: a filterable, spreadsheet-driven feed of education opportunities, new policy research, headlines, and upcoming events."
  />
  <!-- Link previews (email, Teams, Slack) and the browser-tab icon. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ERC Policy Exchange" />
  <meta property="og:title" content="ERC Policy Exchange" />
  <meta property="og:description" content="New education policy research, upcoming events, opportunities, and education headlines, curated by the Texas A&amp;M Education Research Center." />
  <meta property="og:url" content="https://kateb-123.github.io/erc-policy-exchange/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23500000'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='38' font-weight='800' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Work+Sans:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <!-- Font Awesome 7 Free: the same tag and hash the Content Desk uses, so both apps share one icon set. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- ?v= busts stale browser/Pages caches — bump when shipping big changes. -->
  <link rel="stylesheet" href="css/styles.css?v=54" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Top bar (Claude Design handoff, Sep 9, 2026): the ERC mark + site title
       is the h1 and the Home link, then the section links (built by app.js),
       then the global search. On phones the title and the Menu button share
       the first row, the links open in a list under them, and the search
       takes the last row. -->
  <header class="topnav">
    <div class="topnav__in">
      <h1 class="topnav__title">
        <a class="topnav__brand" href="?" data-view="home"><span class="topnav__mark" aria-hidden="true"></span>ERC Policy Exchange</a>
      </h1>
      <button type="button" class="topnav__menu-btn" id="menu-btn" aria-expanded="false" aria-controls="topnav">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
        Menu
      </button>
      <nav id="topnav" class="topnav__links" aria-label="Sections"></nav>
      <div class="topnav__search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input
          type="search"
          id="global-search"
          placeholder="Search everything…"
          aria-label="Search all sections"
          autocomplete="off"
        />
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Landing page (home view): the welcome text, the four section cards,
         then the freshness line. -->
    <section class="landing" id="landing" aria-label="Welcome" hidden>
      <div class="hero">
        <h2 class="hero__title" tabindex="-1" data-focus-target>Howdy! Welcome to the ERC Policy Exchange</h2>
        <p class="hero__text">
          Browse through the latest research, upcoming events, opportunities,
          and education headlines. Curated by the
          <a href="https://erc.cehd.tamu.edu/" target="_blank" rel="noopener">Texas A&amp;M Education Research Center</a>.
        </p>
      </div>
      <div class="cards" id="landing-cards"></div>
      <p class="upd upd--below" id="landing-updated"></p>
    </section>

    <!-- Section view: title + blurb, filter toolbar, count + freshness, feed. -->
    <div class="results" id="section" hidden>
      <div class="section-head" id="section-head" hidden></div>
      <div class="opp-toolbar" id="opp-toolbar" hidden></div>
      <div class="news-list" id="news-list">
        <p class="state state--loading" role="status">Loading the latest items…</p>
      </div>
      <!-- The count element moves into the toolbar's sort row on section views
           (app.js) and back here for search results; the stamp stays below. -->
      <div class="results__meta">
        <p class="results__count" id="news-count" aria-live="polite" role="status"></p>
        <p class="results__updated" id="news-updated"></p>
      </div>
    </div>
  </main>

  <!-- Footer: the contact home (logo + website + email) on every screen size;
       the mobile masthead stays clean because these live here. -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <img
        class="site-footer__logo"
        src="assets/ERC_Horizontal_WhiteText_narrow.png"
        alt="Education Research Center, Texas A&amp;M University"
      />
      <div class="site-footer__links">
        <a class="site-footer__link" href="https://erc.cehd.tamu.edu/" target="_blank" rel="noopener">
          <i class="fa-solid fa-globe site-footer__icon" aria-hidden="true"></i>
          <span>erc.cehd.tamu.edu</span>
        </a>
        <a class="site-footer__link" href="mailto:erc@tamu.edu">
          <i class="fa-solid fa-envelope site-footer__icon" aria-hidden="true"></i>
          <span>erc@tamu.edu</span>
        </a>
      </div>
    </div>
  </footer>

  <script src="js/csv.js?v=2"></script>
  <script src="js/app.js?v=54"></script>
  <!-- Cloudflare Web Analytics: visit counts, no cookies. The site token is public by design. -->
  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "8e90b58f84214ef2a62014c0fd1acf72"}'
  ></script>
</body>
</html>
