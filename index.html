<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERC Policy Exchange</title>
  <meta
    name="description"
    content="New education policy research, upcoming events, opportunities, and education headlines, curated by the Texas A&amp;M Education Research Center."
  />
  <!-- Link previews (email, Teams, Slack) and the browser-tab icon. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ERC Policy Exchange" />
  <meta property="og:title" content="ERC Policy Exchange" />
  <meta property="og:description" content="New education policy research, upcoming events, opportunities, and education headlines, curated by the Texas A&amp;M Education Research Center." />
  <meta property="og:url" content="https://erc-policy-exchange.vercel.app/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="assets/logo/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="icon" href="assets/logo/favicon-32.png?v=2" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap"
    rel="stylesheet"
  />
  <!-- Font Awesome 7 Free: the same tag and hash the Content Desk uses, so both apps share one icon set. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- ?v= busts stale browser/Pages caches — bump when shipping big changes. -->
  <link rel="stylesheet" href="css/styles.css?v=176" />
  <script src="js/grow.js?v=3"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Top bar (Claude Design handoff, Sep 9, 2026): the ERC mark + site title
       is the h1 and the Home link, then the section links (built by app.js);
       the global search sits at the right (Kate, Sep 23: Share moved to the
       home page's button; About the ERC to the home page's credit line and
       the footer). On phones the title and the Menu button share the
       first row and every link opens in a list under them. -->
  <header class="topnav">
    <div class="topnav__in">
      <h1 class="topnav__title">
        <a class="topnav__brand" href="?" data-view="home"><span class="topnav__mark" aria-hidden="true"></span>ERC Policy Exchange</a>
      </h1>
      <button type="button" class="topnav__menu-btn" id="menu-btn" aria-expanded="false" aria-controls="topnav">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
        Menu
      </button>
      <nav id="topnav" class="topnav__links" aria-label="Sections"></nav>
      <div class="topnav__side">
        <form class="topnav__search" id="global-search-form" action="./" method="get" role="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input
            type="search"
            id="global-search"
            name="q"
            placeholder="Search everything…"
            aria-label="Search everything"
            autocomplete="off"
          />
        </form>
      </div>
    </div>
  </header>
  <main id="main">
    <!-- Landing page (home view), Claude Design home v2 (Sep 23, 2026): the
         welcome with the four section buttons and Share, and New & upcoming on
         a gray band, a featured card beside the list that feeds it. Laptops
         show the welcome as a column beside the band; narrower screens show
         the band first (Sep 24). The buttons, the card and the list are built
         by app.js. -->
    <section class="landing" id="landing" aria-label="Welcome" hidden>
      <!-- The welcome heads the whole page in the section pages' style (Kate,
           Sep 24). -->
      <div class="section-head home-head">
        <h2 class="section-head__title" tabindex="-1" data-focus-target>Howdy! Welcome to the ERC Policy Exchange</h2>
      </div>
      <section class="home2-band" id="whats-new" aria-labelledby="wn-h">
        <h2 class="split__hd" id="wn-h">New &amp; Upcoming</h2>
        <div class="home2-split" id="wn-split"></div>
      </section>
      <div class="button-slab">
        <div class="button-group" id="landing-cards"></div>
        <div class="slab-intro">
          <a class="slab-cta" href="share/">Share an item <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
        </div>
      </div>
      <!-- The update and credit lines run under both columns (Kate, Sep 24). -->
      <div class="home-meta">
        <p class="slab-meta" id="landing-updated"></p>
        <p class="slab-meta">Curated by the <a href="about/">Texas A&amp;M Education Research Center</a>.</p>
      </div>
    </section>

    <!-- Section view: title + one line, Quick Search + sort, the feed. -->
    <div class="results" id="section" hidden>
      <div class="section-head" id="section-head" hidden></div>
      <div class="opp-toolbar" id="opp-toolbar" hidden></div>
      <div class="news-list" id="news-list">
        <p class="state state--loading" role="status">Loading…</p>
      </div>
      <!-- The count element's parking spot: app.js seats it on the sort row
           in a section and under the title in search. -->
      <div class="results__meta">
        <p class="results__count" id="news-count" aria-live="polite" role="status"></p>
      </div>
    </div>
  </main>

  <!-- Footer (Claude Design handoff): a cream band with the ERC wordmark and
       the website, email, and Share an item links. -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <img
        class="site-footer__logo"
        src="assets/ERC_Horizontal_MaroonText.png"
        alt="Education Research Center, Texas A&amp;M University"
      />
      <div class="site-footer__links">
        <a class="site-footer__link" href="about/">
          <span class="site-footer__icon site-footer__icon--about" aria-hidden="true"></span>
          <span>About the ERC</span>
        </a>
        <a class="site-footer__link" href="newsletter/">
          <span class="site-footer__icon site-footer__icon--news" aria-hidden="true"></span>
          <span>Join the newsletter</span>
        </a>
        <a class="site-footer__link" href="https://erc.cehd.tamu.edu/" target="_blank" rel="noopener">
          <span class="site-footer__icon site-footer__icon--web" aria-hidden="true"></span>
          <span>erc.cehd.tamu.edu</span>
          <span class="sr-only"> (opens in new tab)</span>
        </a>
        <a class="site-footer__link" href="mailto:erc@tamu.edu">
          <span class="site-footer__icon site-footer__icon--mail" aria-hidden="true"></span>
          <span>erc@tamu.edu</span>
        </a>
        <a class="site-footer__link" href="share/">
          <span class="site-footer__icon site-footer__icon--share" aria-hidden="true"></span>
          <span>Share an item</span>
        </a>
      </div>
    </div>
  </footer>

  <script src="js/csv.js?v=2"></script>
  <script src="js/app.js?v=135"></script>
  <!-- Cloudflare Web Analytics: visit counts, no cookies. The site token is public by design. -->
  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "8e90b58f84214ef2a62014c0fd1acf72"}'
  ></script>
</body>
</html>
