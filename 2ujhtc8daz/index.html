<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The admin door's sign-in (Kate, Sep 23, 2026). Nothing links here and
       search engines are told to stay out; the password, checked on the
       server, is the lock. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in · ERC Policy Exchange</title>
  <link rel="icon" href="../assets/logo/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Work+Sans:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css?v=176" />
  <script src="../js/grow.js?v=3"></script>
</head>
<body>
  <main id="main" class="admin-signin">
    <h1 class="section-head__title">Sign in to edit</h1>
    <form id="f" class="form form--narrow" novalidate>
      <div class="field field--full">
        <label for="p">Password</label>
        <!-- The cursor starts here, and Show lets a long password be read
             back before Sign in (Sep 30 audit). -->
        <input id="p" type="password" autocomplete="current-password" required autofocus>
        <button type="button" class="btn-text btn-text--quiet" id="show" aria-pressed="false" aria-controls="p">Show the password</button>
      </div>
      <div class="btns field--full">
        <button type="submit" class="btn" id="go">Sign in</button>
        <a href="../">Back to the Exchange</a>
      </div>
      <p class="status field--full" id="stat" role="status"></p>
    </form>
    <p id="already" hidden>You are signed in. <a href="../">Back to the Exchange</a></p>
  </main>
<script>
(() => {
  const form = document.getElementById('f');
  const stat = document.getElementById('stat');
  const go = document.getElementById('go');
  const say = (msg, error) => {
    stat.textContent = msg;
    stat.className = `status field--full${error ? ' status--error' : ''}`;
  };
  // Already signed in: say so instead of asking again, with the form away
  // (Sep 30 audit: both showed at once).
  fetch('/api/admin/session', { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => {
      if (!j.ok) return;
      form.hidden = true;
      document.getElementById('already').hidden = false;
    })
    .catch(() => {});
  const show = document.getElementById('show');
  const p = document.getElementById('p');
  show.addEventListener('click', () => {
    const on = p.type === 'password';
    p.type = on ? 'text' : 'password';
    show.setAttribute('aria-pressed', String(on));
    show.textContent = on ? 'Hide the password' : 'Show the password';
    p.focus();
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = p.value;
    // After a miss the cursor goes back in the box with the text selected,
    // so the next paste replaces it (Oct 7 audit F115).
    const again = (msg) => {
      go.disabled = false;
      say(msg, true);
      p.focus();
      p.select();
    };
    if (!password) return again('Enter the password.');
    go.disabled = true;
    say('Checking…');
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const j = await r.json().catch(() => ({ ok: false, error: 'Something went wrong on our side. Try again in a minute.' }));
      if (!j.ok) return again(j.error);
      location.href = '../';
    } catch {
      again("Couldn't reach the server. Check your connection and try again.");
    }
  });
})();
</script>
</body>
</html>
